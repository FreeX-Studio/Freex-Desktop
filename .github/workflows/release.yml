#
# One click in GitHub (Actions > Release > Run workflow): sets the version in
# src-tauri/Cargo.toml, commits and tags it, then starts the Build workflow for the tag, which
# builds everything and publishes the GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (empty: current version if not released yet, else next patch version)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency: release

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Choose version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          current="$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          version="${INPUT#v}"
          if [ -z "$version" ]; then
            if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
              IFS=. read -r major minor patch <<<"$current"
              version="$major.$minor.$((patch + 1))"
            else
              version="$current"
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z, got '$version'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "::error::v$version already exists"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Set version, commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$VERSION" != "$CURRENT" ]; then
            # The package's version in Cargo.toml and Cargo.lock (only the freex-desktop entry).
            sed -i "0,/^version = \"$CURRENT\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
            perl -0pi -e "s/(name = \"freex-desktop\"\nversion = )\"\Q$CURRENT\E\"/\$1\"$VERSION\"/" src-tauri/Cargo.lock
            git diff --stat
            git commit -am "Version $VERSION"
          fi
          git tag -a "v$VERSION" -m "FreeX Desktop $VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: Build and publish
        # Tags pushed with the workflow token don't start workflows, so the build is started
        # explicitly for the tag.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run build.yml --ref "v$VERSION"
          echo "### FreeX Desktop $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged v$VERSION; the *Build* workflow builds everything and publishes the release." >> "$GITHUB_STEP_SUMMARY"
